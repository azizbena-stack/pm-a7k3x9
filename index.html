<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Music</title>
<style>
:root{
  color-scheme: dark;
  /* ---- dataviz palette (dark mode reference instance) ---- */
  --surface-1:      #17171f;
  --page-plane:     #0a0a0f;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --good:           #14c766;
  --good-text:      #0ca30c;
  --warning:        #fab219;
  --serious:        #ec835a;
  --critical:       #e66767;
  --series-blue:    #3987e5;
  --series-blue-2:  #6da7ec;
  --series-blue-3:  #1c5cab;
  --border:         rgba(255,255,255,0.09);
  --border-soft:    rgba(255,255,255,0.06);
  /* ---- brand (decorative, non-chart) ---- */
  --brand-a: #22d3ee;
  --brand-b: #8b5cf6;
  --brand-grad: linear-gradient(135deg,var(--brand-a),var(--brand-b));
  --card: #131319;
  --card-2: #191922;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 9px;
  font-size: 16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(circle at 50% -10%, #191225 0%, #0a0a0f 45%, #050507 100%);
  color: var(--text-primary);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: 28px 12px;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.tabular{font-variant-numeric: tabular-nums;}

/* ============ PHONE FRAME ============ */
.phone-frame{
  position:relative;
  width:412px;
  height:876px;
  background: #05050a;
  border-radius: 46px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 0 0 10px #0d0d13, 0 30px 80px -20px rgba(0,0,0,.8), 0 0 120px -40px rgba(139,92,246,.25);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.phone-notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:24px; background:#05050a; border-radius:0 0 16px 16px; z-index:50;
}
.app-screen{ position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
#view-container{ flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:14px; scroll-behavior:smooth;}
.hidden{display:none !important;}

@media (max-width: 480px){
  body{padding:0; background:#0a0a0f;}
  .phone-frame{ width:100vw; height:100vh; border-radius:0; border:none; box-shadow:none; }
  .phone-notch{display:none;}
}

/* ============ HEADER / TOP BAR ============ */
.topbar{ padding: 18px 18px 10px; position:sticky; top:0; z-index:20; background:linear-gradient(#0a0a0fee 70%, #0a0a0f00); backdrop-filter: blur(6px);}
.brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.5px; font-size:15px;}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--brand-grad); box-shadow:0 0 10px var(--brand-a);}
.brand small{ display:block; font-size:9px; font-weight:600; color:var(--text-muted); letter-spacing:1.5px; margin-top:1px;}
.icon-btn{ width:34px;height:34px;border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:15px; position:relative;}
.icon-btn .badge-dot{position:absolute; top:5px; right:5px; width:7px;height:7px;border-radius:50%; background:var(--critical); border:1.5px solid #05050a;}

.segmented{ display:flex; background:var(--card-2); border-radius:12px; padding:3px; gap:2px; border:1px solid var(--border-soft);}
.segmented button{ flex:1; border:none; background:transparent; color:var(--text-muted); font-weight:700; font-size:11.5px; letter-spacing:.4px; padding:8px 4px; border-radius:9px; cursor:pointer; transition:.15s;}
.segmented button.active{ background:var(--brand-grad); color:#04040a; box-shadow:0 4px 14px -4px rgba(139,92,246,.6);}

.chiprow{ display:flex; gap:7px; overflow-x:auto; padding: 12px 2px 2px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{ flex:0 0 auto; padding:7px 13px; border-radius:20px; background:var(--card-2); border:1px solid var(--border); color:var(--text-secondary); font-size:11.5px; font-weight:700; letter-spacing:.3px; cursor:pointer; white-space:nowrap;}
.chip.active{ background:var(--text-primary); color:#0a0a0f; border-color:var(--text-primary);}
.chip.ghost{ background:transparent; border-style:dashed;}

.section-title{ display:flex;align-items:center;justify-content:space-between; padding:18px 18px 8px;}
.section-title h2{ margin:0; font-size:13px; letter-spacing:1.2px; color:var(--text-secondary); font-weight:800; text-transform:uppercase; display:flex; align-items:center; gap:6px;}
.section-title .link{ font-size:11.5px; font-weight:700; color:var(--brand-a); cursor:pointer;}

/* ============ TRACK ROWS ============ */
.track-list{ display:flex; flex-direction:column; padding: 0 10px;}
.track-row{ display:flex; align-items:center; gap:11px; padding:9px 8px; border-radius:14px; cursor:pointer; transition:.12s; position:relative;}
.track-row:active{ background:var(--card-2); }
.rank{ width:22px; text-align:center; font-weight:800; font-size:13px; color:var(--text-muted); flex:0 0 22px;}
.rank.top3{ color:#ffd76a; font-size:15px;}
.cover{ width:46px;height:46px;border-radius:11px; flex:0 0 46px; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; color:rgba(255,255,255,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);}
.cover.lg{ width:120px;height:120px;border-radius:20px; font-size:34px; box-shadow: 0 20px 40px -15px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.14);}
.cover-wrap{ position:relative; flex:0 0 auto; display:inline-flex;}
.play-overlay{ position:absolute; right:-3px; bottom:-3px; width:19px;height:19px;border-radius:50%; background:rgba(8,8,12,.88); border:1.5px solid rgba(255,255,255,.3); color:#fff; display:flex;align-items:center;justify-content:center; font-size:8.5px; cursor:pointer; padding:0; line-height:1;}
.play-overlay.lg{ width:46px;height:46px; right:-8px; bottom:-8px; font-size:17px; border-width:2px; background:var(--brand-grad); border-color:rgba(255,255,255,.35); color:#050508; box-shadow:0 8px 20px -6px rgba(139,92,246,.7);}
.play-overlay.playing{ background:var(--good-text); border-color:rgba(255,255,255,.4); color:#04160a;}
.play-overlay.lg.playing{ background:var(--good);}
.mini-player{ display:flex; align-items:center; gap:10px; padding:8px 14px; background:linear-gradient(180deg,#171720ee,#0d0d12f5); border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);}
.mini-player .mp-info{ flex:1; min-width:0;}
.mini-player .mp-title{ font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player .mp-artist{ font-size:9.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player .mp-progress{ height:2px; background:rgba(255,255,255,.12); border-radius:2px; margin-top:5px; overflow:hidden;}
.mini-player .mp-progress > div{ height:100%; background:var(--brand-grad); width:0%;}
.mini-player button{ background:none; border:none; color:#fff; font-size:15px; cursor:pointer; padding:4px 5px; flex:0 0 auto;}
.mini-player.mini-player-spotify{ padding:7px 10px; align-items:center;}
.t-info{ flex:1; min-width:0;}
.t-title{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.t-sub{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; display:flex; align-items:center; gap:5px;}
.genre-dot{ width:6px;height:6px;border-radius:50%; flex:0 0 6px; display:inline-block;}
.t-right{ text-align:right; flex:0 0 auto;}
.t-score{ font-size:14px; font-weight:800;}
.t-trend{ font-size:11px; font-weight:800; margin-top:2px;}
.t-trend.up{ color:var(--good-text);}
.t-trend.down{ color:var(--critical);}
.t-trend.flat{ color:var(--text-muted);}
.lock-row{ filter: blur(4px) brightness(.7); pointer-events:none; user-select:none;}

/* ============ CARDS / GENERIC ============ */
.hpad{ padding-left:18px; padding-right:18px;}
.card{ background:var(--card); border:1px solid var(--border-soft); border-radius: var(--radius-lg); padding:16px; }
.hscroll{ display:flex; gap:12px; overflow-x:auto; padding: 4px 18px 6px; scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}

.stat-tile{ background:var(--card); border:1px solid var(--border-soft); border-radius:16px; padding:12px 14px; flex:1; min-width:0;}
.stat-tile .label{ font-size:10px; color:var(--text-muted); font-weight:700; letter-spacing:.4px; text-transform:uppercase;}
.stat-tile .value{ font-size:20px; font-weight:800; margin-top:4px;}
.stat-tile .delta{ font-size:11px; font-weight:700; margin-top:3px;}

.next-card{ flex:0 0 240px; background:linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%); border:1px solid var(--border); border-radius:18px; padding:14px; position:relative; overflow:hidden;}
.next-card .glow{ position:absolute; top:-40px; right:-40px; width:120px;height:120px;border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,.35), transparent 70%); }
.trend-pill{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:800; letter-spacing:.3px;}
.trend-pill.exploding{ background:rgba(230,103,103,.16); color:#ff9d7a;}
.trend-pill.hot{ background:rgba(250,178,25,.16); color:var(--warning);}
.trend-pill.rising{ background:rgba(20,199,102,.16); color:var(--good-text);}
.trend-pill.steady{ background:rgba(255,255,255,.08); color:var(--text-muted);}

.empty-msg{ text-align:center; color:var(--text-muted); font-size:12.5px; padding:30px 24px; line-height:1.6;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{ display:flex; padding:8px 6px calc(10px + env(safe-area-inset-bottom)); background:rgba(10,10,15,.92); border-top:1px solid var(--border-soft); backdrop-filter: blur(10px);}
.nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-muted); padding:6px 2px; cursor:pointer; font-size:9.5px; font-weight:700; letter-spacing:.3px;}
.nav-btn .ic{ font-size:19px; line-height:1;}
.nav-btn.active{ color:var(--text-primary);}
.nav-btn.active .ic{ filter: drop-shadow(0 0 8px var(--brand-a));}

/* ============ OVERLAYS / MODALS ============ */
.overlay{ position:absolute; inset:0; z-index:60; background:#08080c; display:flex; flex-direction:column;}
.overlay.sheet{ background:rgba(5,5,9,.72); backdrop-filter: blur(3px); justify-content:flex-end;}
.sheet-inner{ background:var(--surface-1); border-radius:24px 24px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88%; overflow-y:auto; border-top:1px solid var(--border);}
.overlay-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 6px;}
.close-btn{ width:32px;height:32px;border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:15px; color:var(--text-secondary);}

/* ============ BUTTONS / FORMS ============ */
.btn{ display:flex; align-items:center; justify-content:center; gap:7px; padding:13px 16px; border-radius:14px; border:none; font-weight:800; font-size:13.5px; cursor:pointer; letter-spacing:.2px;}
.btn-primary{ background:var(--brand-grad); color:#050508; box-shadow: 0 10px 26px -10px rgba(139,92,246,.6);}
.btn-ghost{ background:var(--card-2); color:var(--text-primary); border:1px solid var(--border);}
.btn-outline{ background:transparent; color:var(--text-secondary); border:1px solid var(--border);}
.btn-block{ width:100%;}
.btn-sm{ padding:8px 12px; font-size:11.5px; border-radius:10px;}
.field{ margin-bottom:12px;}
.field label{ display:block; font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:6px; letter-spacing:.3px; text-transform:uppercase;}
.field input, .field select{ width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text-primary); padding:12px 13px; border-radius:12px; font-size:13.5px; font-family:inherit;}
.field input:focus, .field select:focus{ outline:none; border-color:var(--brand-a);}
.genre-check-grid{ display:flex; flex-wrap:wrap; gap:7px;}
.gcheck{ padding:8px 12px; border-radius:12px; background:var(--card-2); border:1px solid var(--border); font-size:11.5px; font-weight:700; color:var(--text-secondary); cursor:pointer;}
.gcheck.on{ border-color: currentColor; color:#fff; }

/* ============ TOAST ============ */
#toast-container{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:90%;}
.toast{ background:#1a1a24; border:1px solid var(--border); padding:11px 16px; border-radius:12px; font-size:12.5px; font-weight:600; box-shadow:0 12px 30px -10px rgba(0,0,0,.6); animation: toastin .25s ease; max-width:320px; text-align:center;}
@keyframes toastin{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

/* ============ LOGIN ============ */
.auth-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:34px 26px; position:relative; overflow:hidden;}
.auth-glow{ position:absolute; top:-120px; left:50%; transform:translateX(-50%); width:340px;height:340px;border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,.35), transparent 65%); pointer-events:none;}
.auth-logo{ text-align:center; margin-bottom:34px; position:relative;}
.auth-logo .mark{ width:64px;height:64px;border-radius:20px; margin:0 auto 14px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; font-size:28px; box-shadow:0 20px 40px -10px rgba(139,92,246,.55);}
.auth-logo h1{ font-size:19px; letter-spacing:1px; margin:0;}
.auth-logo p{ color:var(--text-muted); font-size:12px; margin-top:6px;}

/* ============ TRENDS CHART ============ */
.chart-wrap{ position:relative; padding:8px 4px 0;}
.chart-tooltip{ position:absolute; pointer-events:none; background:#1c1c27; border:1px solid var(--border); padding:6px 10px; border-radius:9px; font-size:11px; font-weight:700; white-space:nowrap; transform:translate(-50%,-115%); opacity:0; transition:opacity .1s; z-index:5;}
.periodrow{ display:flex; gap:6px; padding:10px 18px 0; }
.periodrow .chip{ flex:1; text-align:center;}

/* ============ MISC ============ */
.divider{ height:1px; background:var(--border-soft); margin:16px 18px;}
.locrow{ display:flex; align-items:center; gap:10px; padding:9px 0;}
.locrow .rk{ width:20px; font-weight:800; color:var(--text-muted); font-size:12px;}
.locrow .flag{ font-size:17px;}
.locrow .nm{ flex:1; font-size:13px; font-weight:600;}
.locrow .rankbadge{ font-size:10.5px; font-weight:800; color:var(--text-muted);}
.platform-row{ display:flex; flex-wrap:wrap; gap:8px; padding: 4px 0 2px;}
.platform-btn{ flex:1 1 28%; min-width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:11px 4px; border-radius:13px; background:var(--card-2); border:1px solid var(--border); font-size:10px; font-weight:700; color:var(--text-secondary); cursor:pointer; text-align:center;}

.country-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding: 4px 18px 10px;}
.country-card{ background:var(--card); border:1px solid var(--border-soft); border-radius:16px; padding:13px; cursor:pointer;}
.country-card .fl{ font-size:22px;}
.country-card .nm{ font-weight:700; font-size:12.5px; margin-top:6px;}
.country-card .ct{ font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.meter{ height:5px; border-radius:4px; background:rgba(57,135,229,.16); margin-top:8px; overflow:hidden;}
.meter > div{ height:100%; background:var(--series-blue); border-radius:4px;}

.radar-tabs{ display:flex; gap:8px; padding:6px 18px 4px;}
.alert-item{ display:flex; gap:11px; padding:12px 18px; align-items:flex-start;}
.alert-item .aic{ width:36px;height:36px;border-radius:11px; background:var(--card-2); display:flex;align-items:center;justify-content:center; font-size:16px; flex:0 0 36px; border:1px solid var(--border);}
.alert-item .at{ font-size:12.5px; font-weight:700;}
.alert-item .ad{ font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.4;}
.alert-item .atime{ font-size:9.5px; color:var(--text-muted); margin-top:4px;}

.fav-row{ display:flex; align-items:center; gap:11px; padding:9px 18px;}
.fav-row .rm{ margin-left:auto; color:var(--text-muted); font-size:11px; font-weight:700; cursor:pointer;}

/* ============ ADMIN ============ */
.admin-root{ position:fixed; inset:0; z-index:500; background:#08080c; display:flex; flex-direction:column; overflow-y:auto; font-family: system-ui, sans-serif;}
.admin-topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 26px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:#08080cf2; backdrop-filter:blur(8px); z-index:5;}
.admin-body{ padding:22px 26px 60px; max-width:1100px; margin:0 auto; width:100%;}
.admin-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
.admin-section{ margin-bottom:26px;}
.admin-section h3{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
.slider-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.slider-row .lbl{ width:190px; font-size:12.5px; font-weight:600; color:var(--text-secondary); flex:0 0 190px;}
.slider-row input[type=range]{ flex:1; accent-color:var(--brand-a); height:4px;}
.slider-row .val{ width:46px; text-align:right; font-weight:800; font-size:13px;}
.weight-total{ font-size:12px; color:var(--text-muted); margin-top:4px;}
.src-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--card); border:1px solid var(--border-soft); border-radius:12px; margin-bottom:8px;}
.src-row .nm{ font-size:12.5px; font-weight:700;}
.src-row .desc{ font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.status-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:800;}
.status-chip.good{ background:rgba(20,199,102,.14); color:var(--good-text);}
.status-chip.warning{ background:rgba(250,178,25,.14); color:var(--warning);}
.status-chip.critical{ background:rgba(230,103,103,.14); color:var(--critical);}
.status-chip .sw{ width:7px;height:7px;border-radius:50%; background:currentColor;}
.admin-table{ width:100%; border-collapse:collapse; font-size:12.5px;}
.admin-table th{ text-align:left; color:var(--text-muted); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--border-soft);}
.admin-table td{ padding:9px 10px; border-bottom:1px solid var(--border-soft);}
.barbg{ height:8px; background:rgba(57,135,229,.14); border-radius:5px; width:120px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.barbg > div{ height:100%; background:var(--series-blue);}
</style>
</head>
<body>

<div class="phone-frame" id="phoneFrame">
  <div class="phone-notch"></div>
  <div id="toast-container"></div>

  <!-- AUTH -->
  <div id="authScreen" class="app-screen">
    <div class="auth-wrap" id="authWrap"></div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="app-screen hidden">
    <main id="view-container"></main>
    <div id="miniPlayer"></div>
    <nav class="bottom-nav">
      <button class="nav-btn" data-action="nav" data-view="home"><span class="ic">🏆</span><span data-i18n="nav.top">Top</span></button>
      <button class="nav-btn" data-action="nav" data-view="nextbig"><span class="ic">🚀</span><span data-i18n="nav.nextbig">Next Big</span></button>
      <button class="nav-btn" data-action="nav" data-view="explore"><span class="ic">🌍</span><span data-i18n="nav.explore">Explore</span></button>
      <button class="nav-btn" data-action="nav" data-view="radar"><span class="ic">📡</span><span data-i18n="nav.radar">Radar</span></button>
      <button class="nav-btn" data-action="nav" data-view="profile"><span class="ic">👤</span><span data-i18n="nav.profile">Profil</span></button>
    </nav>
  </div>

  <!-- TRACK DETAIL -->
  <div id="trackOverlay" class="overlay hidden"></div>

  <!-- GENRE SHEET -->
  <div id="genreOverlay" class="overlay sheet hidden"></div>

  <!-- PAYWALL -->
  <div id="paywallOverlay" class="overlay sheet hidden"></div>
</div>

<!-- ADMIN (breaks out of phone frame) -->
<div id="adminOverlay" class="admin-root hidden"></div>

<script src="app.js?v=18"></script>
</body>
</html>
