<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Music</title>
<style>
:root{
  color-scheme: dark;
  /* ---- dataviz palette (dark mode reference instance) ---- */
  --surface-1:      #17171f;
  --page-plane:     #0a0a0f;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --good:           #14c766;
  --good-text:      #0ca30c;
  --warning:        #fab219;
  --serious:        #ec835a;
  --critical:       #e66767;
  --series-blue:    #3987e5;
  --series-blue-2:  #6da7ec;
  --series-blue-3:  #1c5cab;
  --border:         rgba(255,255,255,0.09);
  --border-soft:    rgba(255,255,255,0.06);
  /* ---- brand (decorative, non-chart) ---- */
  --brand-a: #22d3ee;
  --brand-b: #8b5cf6;
  --brand-grad: linear-gradient(135deg,var(--brand-a),var(--brand-b));
  --card: #131319;
  --card-2: #191922;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 9px;
  font-size: 16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
input,select,textarea{font-size:16px !important;}
body{
  margin:0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(circle at 50% -10%, #191225 0%, #0a0a0f 45%, #050507 100%);
  color: var(--text-primary);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: 28px 12px;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.tabular{font-variant-numeric: tabular-nums;}

/* ============ PHONE FRAME ============ */
.phone-frame{
  position:relative;
  width:412px;
  height:876px;
  background: #05050a;
  border-radius: 46px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 0 0 10px #0d0d13, 0 30px 80px -20px rgba(0,0,0,.8), 0 0 120px -40px rgba(139,92,246,.25);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.phone-notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:24px; background:#05050a; border-radius:0 0 16px 16px; z-index:50;
}
.app-screen{ position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
#view-container{ flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:14px; scroll-behavior:smooth;}
.hidden{display:none !important;}

@media (max-width: 480px){
  body{padding:0; background:#0a0a0f;}
  .phone-frame{ width:100vw; height:100vh; border-radius:0; border:none; box-shadow:none; }
  .phone-notch{display:none;}
}

/* ============ HEADER / TOP BAR ============ */
.topbar{ padding: 18px 18px 10px; position:sticky; top:0; z-index:20; background:linear-gradient(#0a0a0fee 70%, #0a0a0f00); backdrop-filter: blur(6px);}
.brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.5px; font-size:15px;}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--brand-grad); box-shadow:0 0 10px var(--brand-a);}
.brand small{ display:block; font-size:9px; font-weight:600; color:var(--text-muted); letter-spacing:1.5px; margin-top:1px;}
.icon-btn{ width:34px;height:34px;border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:15px; position:relative;}
.icon-btn .badge-dot{position:absolute; top:5px; right:5px; width:7px;height:7px;border-radius:50%; background:var(--critical); border:1.5px solid #05050a;}

.segmented{ display:flex; background:var(--card-2); border-radius:12px; padding:3px; gap:2px; border:1px solid var(--border-soft);}
.segmented button{ flex:1; border:none; background:transparent; color:var(--text-muted); font-weight:700; font-size:11.5px; letter-spacing:.4px; padding:8px 4px; border-radius:9px; cursor:pointer; transition:.15s;}
.segmented button.active{ background:var(--brand-grad); color:#04040a; box-shadow:0 4px 14px -4px rgba(139,92,246,.6);}

.chiprow{ display:flex; gap:7px; overflow-x:auto; padding: 12px 2px 2px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{ flex:0 0 auto; padding:7px 13px; border-radius:20px; background:var(--card-2); border:1px solid var(--border); color:var(--text-secondary); font-size:11.5px; font-weight:700; letter-spacing:.3px; cursor:pointer; white-space:nowrap;}
.chip.active{ background:var(--text-primary); color:#0a0a0f; border-color:var(--text-primary);}
.chip.ghost{ background:transparent; border-style:dashed;}

.section-title{ display:flex;align-items:center;justify-content:space-between; padding:18px 18px 8px;}
.section-title h2{ margin:0; font-size:13px; letter-spacing:1.2px; color:var(--text-secondary); font-weight:800; text-transform:uppercase; display:flex; align-items:center; gap:6px;}
.section-title .link{ font-size:11.5px; font-weight:700; color:var(--brand-a); cursor:pointer;}

/* ============ TRACK ROWS ============ */
.track-list{ display:flex; flex-direction:column; padding: 0 10px;}
.track-row{ display:flex; align-items:center; gap:11px; padding:9px 8px; border-radius:14px; cursor:pointer; transition:.12s; position:relative;}
.track-row:active{ background:var(--card-2); }
.rank{ width:22px; text-align:center; font-weight:800; font-size:13px; color:var(--text-muted); flex:0 0 22px;}
.rank.top3{ color:#ffd76a; font-size:15px;}
.cover{ width:46px;height:46px;border-radius:11px; flex:0 0 46px; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; color:rgba(255,255,255,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);}
.cover.lg{ width:120px;height:120px;border-radius:20px; font-size:34px; box-shadow: 0 20px 40px -15px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.14);}
.cover-wrap{ position:relative; flex:0 0 auto; display:inline-flex;}
.play-overlay{ position:absolute; right:-3px; bottom:-3px; width:19px;height:19px;border-radius:50%; background:rgba(8,8,12,.88); border:1.5px solid rgba(255,255,255,.3); color:#fff; display:flex;align-items:center;justify-content:center; font-size:8.5px; cursor:pointer; padding:0; line-height:1;}
.play-overlay.lg{ width:46px;height:46px; right:-8px; bottom:-8px; font-size:17px; border-width:2px; background:var(--brand-grad); border-color:rgba(255,255,255,.35); color:#050508; box-shadow:0 8px 20px -6px rgba(139,92,246,.7);}
.play-overlay.playing{ background:var(--good-text); border-color:rgba(255,255,255,.4); color:#04160a;}
.play-overlay.lg.playing{ background:var(--good);}
.mini-player{ display:flex; align-items:center; gap:10px; padding:8px 14px; background:linear-gradient(180deg,#171720ee,#0d0d12f5); border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);}
.mini-player .mp-info{ flex:1; min-width:0;}
.mini-player .mp-title{ font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player .mp-artist{ font-size:9.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player .mp-progress{ height:2px; background:rgba(255,255,255,.12); border-radius:2px; margin-top:5px; overflow:hidden;}
.mini-player .mp-progress > div{ height:100%; background:var(--brand-grad); width:0%;}
.mini-player button{ background:none; border:none; color:#fff; font-size:15px; cursor:pointer; padding:4px 5px; flex:0 0 auto;}
.mini-player.mini-player-spotify{ padding:7px 10px; align-items:center;}
.mini-player.mini-player-embed{ display:block; padding:8px 10px;}
.mini-player.mini-player-embed .mp-embed-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.mini-player.mini-player-embed .mp-title{ flex:1; min-width:0;}
.t-info{ flex:1; min-width:0;}
.t-title{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.t-sub{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; display:flex; align-items:center; gap:5px;}
.genre-dot{ width:6px;height:6px;border-radius:50%; flex:0 0 6px; display:inline-block;}
.t-right{ text-align:right; flex:0 0 auto;}
.mk{ display:inline-block; margin-left:8px; font-size:17px; color:var(--text-muted); cursor:pointer; user-select:none;}
.mk.heart.on{ color:#ff4d6d;}
.mk.seen.on{ color:#2ecc71; font-weight:800;}
.t-score{ font-size:14px; font-weight:800;}
.t-trend{ font-size:11px; font-weight:800; margin-top:2px;}
.t-trend.up{ color:var(--good-text);}
.t-trend.down{ color:var(--critical);}
.t-trend.flat{ color:var(--text-muted);}
.lock-row{ filter: blur(4px) brightness(.7); pointer-events:none; user-select:none;}

/* ============ CARDS / GENERIC ============ */
.hpad{ padding-left:18px; padding-right:18px;}
.card{ background:var(--card); border:1px solid var(--border-soft); border-radius: var(--radius-lg); padding:16px; }
.hscroll{ display:flex; gap:12px; overflow-x:auto; padding: 4px 18px 6px; scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}

.stat-tile{ background:var(--card); border:1px solid var(--border-soft); border-radius:16px; padding:12px 14px; flex:1; min-width:0;}
.stat-tile .label{ font-size:10px; color:var(--text-muted); font-weight:700; letter-spacing:.4px; text-transform:uppercase;}
.stat-tile .value{ font-size:20px; font-weight:800; margin-top:4px;}
.stat-tile .delta{ font-size:11px; font-weight:700; margin-top:3px;}

.next-card{ flex:0 0 240px; background:linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%); border:1px solid var(--border); border-radius:18px; padding:14px; position:relative; overflow:hidden;}
.next-card .glow{ position:absolute; top:-40px; right:-40px; width:120px;height:120px;border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,.35), transparent 70%); }
.trend-pill{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:800; letter-spacing:.3px;}
.trend-pill.exploding{ background:rgba(230,103,103,.16); color:#ff9d7a;}
.trend-pill.hot{ background:rgba(250,178,25,.16); color:var(--warning);}
.trend-pill.rising{ background:rgba(20,199,102,.16); color:var(--good-text);}
.trend-pill.steady{ background:rgba(255,255,255,.08); color:var(--text-muted);}

.empty-msg{ text-align:center; color:var(--text-muted); font-size:12.5px; padding:30px 24px; line-height:1.6;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{ display:flex; padding:8px 6px calc(10px + env(safe-area-inset-bottom)); background:rgba(10,10,15,.92); border-top:1px solid var(--border-soft); backdrop-filter: blur(10px);}
.nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-muted); padding:6px 2px; cursor:pointer; font-size:9.5px; font-weight:700; letter-spacing:.3px;}
.nav-btn .ic{ font-size:19px; line-height:1;}
.nav-btn.active{ color:var(--text-primary);}
.nav-btn.active .ic{ filter: drop-shadow(0 0 8px var(--brand-a));}
.top-nav{ display:flex; padding:24px 6px 4px; background:rgba(10,10,15,.92); border-bottom:1px solid var(--border-soft); backdrop-filter: blur(10px);}
.top-nav .nav-btn{ flex-direction:row; justify-content:center; gap:4px; font-size:9.5px; padding:6px 1px;}
.top-nav .nav-btn .ic{ font-size:14px;}
@media (max-width:520px){ .top-nav{ padding-top:calc(6px + env(safe-area-inset-top)); } }
@media (max-width:520px){ .top-nav .nav-btn{ flex-direction:column; gap:2px; min-width:0; font-size:9px; letter-spacing:0; } .top-nav .nav-btn span:last-child{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } }
html,body{overflow-x:hidden; max-width:100vw;}

/* ============ OVERLAYS / MODALS ============ */
.overlay{ position:absolute; inset:0; z-index:60; background:#08080c; display:flex; flex-direction:column;}
.overlay.sheet{ background:rgba(5,5,9,.72); backdrop-filter: blur(3px); justify-content:flex-end;}
.sheet-inner{ background:var(--surface-1); border-radius:24px 24px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88%; overflow-y:auto; border-top:1px solid var(--border);}
.overlay-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 6px;}
.close-btn{ width:32px;height:32px;border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:15px; color:var(--text-secondary);}

/* ============ BUTTONS / FORMS ============ */
.btn{ display:flex; align-items:center; justify-content:center; gap:7px; padding:13px 16px; border-radius:14px; border:none; font-weight:800; font-size:13.5px; cursor:pointer; letter-spacing:.2px;}
.btn-primary{ background:var(--brand-grad); color:#050508; box-shadow: 0 10px 26px -10px rgba(139,92,246,.6);}
.btn-ghost{ background:var(--card-2); color:var(--text-primary); border:1px solid var(--border);}
.btn-outline{ background:transparent; color:var(--text-secondary); border:1px solid var(--border);}
.btn-block{ width:100%;}
.btn-sm{ padding:8px 12px; font-size:11.5px; border-radius:10px;}
.field{ margin-bottom:12px;}
.field label{ display:block; font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:6px; letter-spacing:.3px; text-transform:uppercase;}
.field input, .field select{ width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text-primary); padding:12px 13px; border-radius:12px; font-size:13.5px; font-family:inherit;}
.field input:focus, .field select:focus{ outline:none; border-color:var(--brand-a);}
.genre-check-grid{ display:flex; flex-wrap:wrap; gap:7px;}
.gcheck{ padding:8px 12px; border-radius:12px; background:var(--card-2); border:1px solid var(--border); font-size:11.5px; font-weight:700; color:var(--text-secondary); cursor:pointer;}
.gcheck.on{ border-color: currentColor; color:#fff; }

/* ============ TOAST ============ */
#toast-container{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:90%;}
.toast{ background:#1a1a24; border:1px solid var(--border); padding:11px 16px; border-radius:12px; font-size:12.5px; font-weight:600; box-shadow:0 12px 30px -10px rgba(0,0,0,.6); animation: toastin .25s ease; max-width:320px; text-align:center;}
@keyframes toastin{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

/* ============ LOGIN ============ */
.auth-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:34px 26px; position:relative; overflow:hidden;}
.auth-glow{ position:absolute; top:-120px; left:50%; transform:translateX(-50%); width:340px;height:340px;border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,.35), transparent 65%); pointer-events:none;}
.auth-logo{ text-align:center; margin-bottom:34px; position:relative;}
.auth-logo .mark{ width:64px;height:64px;border-radius:20px; margin:0 auto 14px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; font-size:28px; box-shadow:0 20px 40px -10px rgba(139,92,246,.55);}
.auth-logo h1{ font-size:19px; letter-spacing:1px; margin:0;}
.auth-logo p{ color:var(--text-muted); font-size:12px; margin-top:6px;}

/* ============ TRENDS CHART ============ */
.chart-wrap{ position:relative; padding:8px 4px 0;}
.chart-tooltip{ position:absolute; pointer-events:none; background:#1c1c27; border:1px solid var(--border); padding:6px 10px; border-radius:9px; font-size:11px; font-weight:700; white-space:nowrap; transform:translate(-50%,-115%); opacity:0; transition:opacity .1s; z-index:5;}
.periodrow{ display:flex; gap:6px; padding:10px 18px 0; }
.periodrow .chip{ flex:1; text-align:center;}

/* ============ MISC ============ */
.divider{ height:1px; background:var(--border-soft); margin:16px 18px;}
.locrow{ display:flex; align-items:center; gap:10px; padding:9px 0;}
.locrow .rk{ width:20px; font-weight:800; color:var(--text-muted); font-size:12px;}
.locrow .flag{ font-size:17px;}
.locrow .nm{ flex:1; font-size:13px; font-weight:600;}
.locrow .rankbadge{ font-size:10.5px; font-weight:800; color:var(--text-muted);}
.platform-row{ display:flex; flex-wrap:wrap; gap:8px; padding: 4px 0 2px;}
.platform-btn{ flex:1 1 28%; min-width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:11px 4px; border-radius:13px; background:var(--card-2); border:1px solid var(--border); font-size:10px; font-weight:700; color:var(--text-secondary); cursor:pointer; text-align:center;}

.country-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding: 4px 18px 10px;}
.country-card{ background:var(--card); border:1px solid var(--border-soft); border-radius:16px; padding:13px; cursor:pointer;}
.country-card .fl{ font-size:22px;}
.country-card .nm{ font-weight:700; font-size:12.5px; margin-top:6px;}
.country-card .ct{ font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.meter{ height:5px; border-radius:4px; background:rgba(57,135,229,.16); margin-top:8px; overflow:hidden;}
.meter > div{ height:100%; background:var(--series-blue); border-radius:4px;}

.radar-tabs{ display:flex; flex-wrap:wrap; gap:6px; padding:6px 10px 4px; justify-content:center;}
.radar-tabs .chip{ padding:7px 12px; font-size:12px; letter-spacing:0; flex:0 0 auto; white-space:nowrap; text-align:center;}
.alert-item{ display:flex; gap:11px; padding:12px 18px; align-items:flex-start;}
.alert-item .aic{ width:36px;height:36px;border-radius:11px; background:var(--card-2); display:flex;align-items:center;justify-content:center; font-size:16px; flex:0 0 36px; border:1px solid var(--border);}
.alert-item .at{ font-size:12.5px; font-weight:700;}
.alert-item .ad{ font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.4;}
.alert-item .atime{ font-size:9.5px; color:var(--text-muted); margin-top:4px;}

.fav-row{ display:flex; align-items:center; gap:11px; padding:9px 18px;}
.fav-row .rm{ margin-left:auto; color:var(--text-muted); font-size:11px; font-weight:700; cursor:pointer;}

/* ============ ADMIN ============ */
.admin-root{ position:fixed; inset:0; z-index:500; background:#08080c; display:flex; flex-direction:column; overflow-y:auto; font-family: system-ui, sans-serif;}
.admin-topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 26px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:#08080cf2; backdrop-filter:blur(8px); z-index:5;}
.admin-body{ padding:22px 26px 60px; max-width:1100px; margin:0 auto; width:100%;}
.admin-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
.admin-section{ margin-bottom:26px;}
.admin-section h3{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
.slider-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.slider-row .lbl{ width:190px; font-size:12.5px; font-weight:600; color:var(--text-secondary); flex:0 0 190px;}
.slider-row input[type=range]{ flex:1; accent-color:var(--brand-a); height:4px;}
.slider-row .val{ width:46px; text-align:right; font-weight:800; font-size:13px;}
.weight-total{ font-size:12px; color:var(--text-muted); margin-top:4px;}
.src-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--card); border:1px solid var(--border-soft); border-radius:12px; margin-bottom:8px;}
.src-row .nm{ font-size:12.5px; font-weight:700;}
.src-row .desc{ font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.status-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:800;}
.status-chip.good{ background:rgba(20,199,102,.14); color:var(--good-text);}
.status-chip.warning{ background:rgba(250,178,25,.14); color:var(--warning);}
.status-chip.critical{ background:rgba(230,103,103,.14); color:var(--critical);}
.status-chip .sw{ width:7px;height:7px;border-radius:50%; background:currentColor;}
.admin-table{ width:100%; border-collapse:collapse; font-size:12.5px;}
.admin-table th{ text-align:left; color:var(--text-muted); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--border-soft);}
.admin-table td{ padding:9px 10px; border-bottom:1px solid var(--border-soft);}
.barbg{ height:8px; background:rgba(57,135,229,.14); border-radius:5px; width:120px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.barbg > div{ height:100%; background:var(--series-blue);}
</style>
</head>
<body>

<div class="phone-frame" id="phoneFrame">
  <div class="phone-notch"></div>
  <div id="toast-container"></div>

  <!-- AUTH -->
  <div id="authScreen" class="app-screen">
    <div class="auth-wrap" id="authWrap"></div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="app-screen hidden">

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function strSeed(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function pick(arr, rand){ return arr[Math.floor(rand()*arr.length)]; }
function pickN(arr, n, rand){
  const copy = arr.slice(); const out=[];
  while(out.length<n && copy.length){ out.push(copy.splice(Math.floor(rand()*copy.length),1)[0]); }
  return out;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtPct(v){ const s = v>=0? '+':''; return s+v.toFixed(0)+'%'; }
function fmtNum(n){ return n.toLocaleString((typeof LOCALE_MAP!=='undefined' && LOCALE_MAP[state.lang]) || 'fr-FR'); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(d){ return d.toLocaleDateString((typeof LOCALE_MAP!=='undefined' && LOCALE_MAP[state.lang]) || 'fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }

/* ---------------------------- LIVE CHARTS (Supabase) -----------------------
   Real, per-city Apple Music / Spotify / Shazam rankings, synced daily from

const SUPABASE_URL = 'https://ysrenidrdyiafnfhpfpg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QMAo4k31YfvE2mfGA33Yog_YdG0RLwv';
const SUPABASE_HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

// Maps this app's internal city id to the exact city_name stored in Supabase
// (set when the daily sync was configured — keep in sync with that list).
const APP_CITY_TO_DB_NAME = {

let dbCityIdCache = null; // { 'Paris': 'uuid', ... } — fetched once, reused all session
async function getDbCityId(appCityId){
  const dbName = APP_CITY_TO_DB_NAME[appCityId];
  if(!dbName) return null;
  if(!dbCityIdCache){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cities?select=id,city_name`, { headers: SUPABASE_HEADERS });
      const rows = await res.json();
      dbCityIdCache = {};
      (rows||[]).forEach(r=>{ dbCityIdCache[r.city_name] = r.id; });
    } catch(e){ dbCityIdCache = {}; }
  }
  return dbCityIdCache[dbName] || null;
}

const realTracksCache = {}; // synthetic-id -> track-like object, so real chart rows can use the same play engine
const realChartCache = {}; // `${appCityId}:${platform}:${period}` -> entries array (session-only)
// period: 'today' (comparaison au jour précédent, fournie directement par Soundcharts
// via previous_rank) | '7d' | '30d' (on recalcule alors le classement d'il y a 7/30
// jours à partir d'un second instantané et on compare les morceaux par titre+artiste,
// puisque leur identifiant peut changer d'un instantané à l'autre).
async function fetchRealCityChart(appCityId, platform, period){
  period = period || 'today';
  const key = appCityId+':'+platform+':'+period;
  if(realChartCache[key]) return realChartCache[key];
  const dbCityId = await getDbCityId(appCityId);
  if(!dbCityId){ realChartCache[key] = []; return []; }
  try{
    const latestRes = await fetch(
      `${SUPABASE_URL}/rest/v1/chart_entries?city_id=eq.${dbCityId}&platform=eq.${platform}&select=captured_at&order=captured_at.desc&limit=1`,
      { headers: SUPABASE_HEADERS }
    );
    const latestRows = await latestRes.json();
    if(!latestRows || !latestRows.length){ realChartCache[key] = []; return []; }
    const latestDate = latestRows[0].captured_at;
    const entriesRes = await fetch(
      `${SUPABASE_URL}/rest/v1/chart_entries?city_id=eq.${dbCityId}&platform=eq.${platform}&captured_at=eq.${latestDate}&select=rank,previous_rank,tracks(title,artist_name,cover_url,youtube_id)&order=rank.asc&limit=100`,
      { headers: SUPABASE_HEADERS }
    );
    let entries = await entriesRes.json();
    entries = entries || [];

    if(period!=='today' && entries.length){
      const daysAgo = period==='30d' ? 30 : 7;
      const targetDate = new Date(new Date(latestDate).getTime() - daysAgo*86400000).toISOString();
      const histDateRes = await fetch(
        `${SUPABASE_URL}/rest/v1/chart_entries?city_id=eq.${dbCityId}&platform=eq.${platform}&captured_at=lte.${targetDate}&select=captured_at&order=captured_at.desc&limit=1`,
        { headers: SUPABASE_HEADERS }
      );
      const histDateRows = await histDateRes.json();
      let histMap = null;
      if(histDateRows && histDateRows.length){
        const histDate = histDateRows[0].captured_at;
        const histRes = await fetch(
          `${SUPABASE_URL}/rest/v1/chart_entries?city_id=eq.${dbCityId}&platform=eq.${platform}&captured_at=eq.${histDate}&select=rank,tracks(title,artist_name)`,
          { headers: SUPABASE_HEADERS }
        );
        const histEntries = await histRes.json();
        histMap = {};
        (histEntries||[]).forEach(h=>{
          const t = h.tracks || {};
          const k = (t.title||'').toLowerCase().trim()+'|'+(t.artist_name||'').toLowerCase().trim();
          histMap[k] = h.rank;
        });
      }
      // Remplace previous_rank par le rang d'il y a 7/30 jours (ou null si on n'a pas
      // encore assez d'historique synchronisé pour remonter aussi loin, ou si le
      // morceau n'était pas dans le classement à cette date).
      entries = entries.map(e=>{
        const t = e.tracks || {};
        const k = (t.title||'').toLowerCase().trim()+'|'+(t.artist_name||'').toLowerCase().trim();
        const histRank = histMap ? (histMap[k]!=null ? histMap[k] : null) : null;
        return Object.assign({}, e, { previous_rank: histRank });
      });
    }

    realChartCache[key] = entries;
    return entries;
  } catch(e){
    realChartCache[key] = [];
    return [];
  }
}

function realTrackMoveHTML(rank, prev){
  if(prev==null || prev===rank) return `<span class="t-trend flat">–</span>`;

  return `<span class="t-trend down">▼ ${rank-prev}</span>`;
}
// IMPORTANT — leçon retenue : Soundcharts ne fournit AUCUN genre réel par morceau
// pour les classements "Ville" (contrairement au catalogue simulé Monde/Pays). Une
// version précédente assignait un genre inventé (déterministe mais faux), l'affichait
// et s'en servait pour filtrer — ça a produit des titres reggaeton/latin trap étiquetés
// "Techno", confirmé par capture vidéo. C'était la mauvaise approche : on ne doit
// jamais présenter une donnée fabriquée comme si elle venait de Soundcharts.
// cityTrackGenre() reste UNIQUEMENT pour varier la couleur/texture de la pochette
// (coverStyle) — jamais affiché en texte, jamais utilisé pour filtrer la liste Ville.
const CITY_PSEUDO_GENRES = ['afro-house','melodic-house','melodic-techno'];
function cityTrackGenre(title, artist){
  const seedKey = (title||'')+'|'+(artist||'');
  return CITY_PSEUDO_GENRES[strSeed(seedKey) % CITY_PSEUDO_GENRES.length];
}
// Le job de sync Soundcharts peut laisser une entrée dont le titre n'a pas encore
// été résolu (placeholder côté base, ex. "Track Loading..."). Ne jamais afficher ça
// comme si c'était un vrai titre de morceau — on filtre ces entrées de la liste.
function isPlaceholderTitle(title){
  if(!title) return true;
  const s = String(title).trim();
  if(!s) return true;
  if(/loading/i.test(s)) return true;
  if(/^(unknown|inconnu|n\/a|untitled|sans titre)$/i.test(s)) return true;
  return false;
}

    return head + `<div class="hpad" style="display:flex;gap:8px;margin:10px 0;"><button class="btn" data-action="pl-back">← Retour</button><button class="btn" data-action="pl-del">Supprimer la playlist</button></div><div class="hpad" style="display:flex;gap:8px;margin:0 0 10px;"><button class="btn btn-primary" data-action="pl-mix" data-s="1" style="flex:1;">🔀 Mix aléatoire</button><button class="btn" data-action="pl-mix" data-s="0" style="flex:1;">🎛️ Mix dans l'ordre</button></div><div class="hpad" style="display:flex;gap:8px;margin:8px 0 10px;"><button class="btn" data-action="pl-yt" style="flex:1;">🔗 Lien YouTube de la playlist</button></div><div class="section-title"><h2>${esc(plOpen)}</h2></div>` + (rows || '<div class="empty-msg">Playlist vide : touchez ＋ sur un morceau pour l\'ajouter.</div>');
  }
  const names = Object.keys(plMap);
  return head + `<div class="hpad" style="display:flex;gap:8px;margin:10px 0;"><input id="plName" placeholder="Nom de la playlist" style="flex:1;background:var(--card-2);border:1px solid var(--border);color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;"><button class="btn btn-primary" data-action="pl-create">Créer</button></div>`
    + (names.length ? names.map(n=>`<div class="track-row" data-action="pl-open" data-n="${esc(n)}"><div class="t-info"><div class="t-title">🎵 ${esc(n)}</div><div class="t-sub">${plMap[n].length} morceau(x)</div></div></div>`).join('') : '<div class="empty-msg">Aucune playlist. Créez-en une, puis ajoutez des morceaux avec ＋.</div>');
}
function openAddPl(id){
  const names = Object.keys(plMap);
  const ov = document.getElementById('playChoice');
  ov.innerHTML = `<div class="sheet-inner"><h3 style="margin:0 0 10px;">Ajouter à une playlist</h3>${names.map(n=>`<button class="btn btn-block" style="margin-bottom:8px;" data-action="pl-add" data-n="${esc(n)}" data-id="${id}">${esc(n)}</button>`).join('')}<div style="display:flex;gap:8px;"><input id="plNew" placeholder="Nouvelle playlist" style="flex:1;background:var(--card-2);border:1px solid var(--border);color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;"><button class="btn btn-primary" data-action="pl-add" data-n="" data-id="${id}">Créer</button></div><button class="btn btn-block" style="margin-top:10px;" data-action="close-play-choice">Fermer</button></div>`;
  ov.classList.remove('hidden');
}
function addToPl(id, name){
  name = (name || (document.getElementById('plNew')||{}).value || '').trim(); if(!name) return;
  const t = TRACKS.find(x=>x.id===id) || realTracksCache[id]; if(!t) return;
  const l = plMap[name] = plMap[name] || [], k = itKey(t);
  if(!l.some(f=>itKey({title:f.title, artist:f.artist})===k)) l.push({title:t.title, artist:t.artist});
  plSave(); document.getElementById('playChoice').classList.add('hidden'); toast('Ajouté à « '+name+' »');
}
function renderRealTrackRow(entry, idx, locked){
  const t = entry.tracks || {};
  const seedKey = (t.title||'')+'|'+(t.artist_name||'');
  const rid = 'real-' + strSeed(seedKey+'|'+idx);
  realTracksCache[rid] = {
    id: rid,
    isRealCity: true, // marque une entrée de classement ville réel : jamais de genre inventé affiché
    title: t.title || 'Titre inconnu',
    artist: t.artist_name || '',
    coverUrl: t.cover_url || null,
    coverSeed: strSeed(seedKey) % 9999,
    genre: cityTrackGenre(t.title, t.artist_name), // cosmétique uniquement (couleur pochette) — voir note ci-dessus, jamais affiché/filtré
    // profil démo assigné en tournant sur la position dans la liste (pas par hasard) :
    // deux morceaux voisins dans le classement n'ont jamais le même profil, et ces
    // profils sont volontairement très contrastés (voir DEMO_PROFILES) — tempo,
    // timbre du kick inclus, pas juste l'habillage en arrière-plan.
    demoProfile: DEMO_PROFILES[idx % DEMO_PROFILES.length],
    demoBpm: DEMO_PROFILES[idx % DEMO_PROFILES.length].bpm,
    // Found automatically by the sync job (YouTube search) — kept only to
    // offer a real video link from the track detail view. The quick tap-to-
    // play button here always goes through the Apple Music preview /
    // generated-loop pipeline instead (see togglePlay) — exactly like the
    // Monde/Pays rows — because a YouTube iframe's autoplay cannot reliably
    // follow this tap's gesture on mobile Safari.
    youtubeId: t.youtube_id || ytLookup(t.title, t.artist_name),
  };
  const t2 = realTracksCache[rid]; // normalized object (coverHTML/genreById expect this shape, same as Monde/Pays rows)
  return `
  <div class="track-row ${locked?'lock-row':''}" style="padding-left:0;" ${locked?'':`data-action="toggle-play" data-id="${rid}"`}>
    <div class="rank ${idx<3?'top3':''}">${idx<3? ['🥇','🥈','🥉'][idx] : (idx+1)}</div>
    ${coverHTML(t2,false)}
    <div class="t-info">
      <div class="t-title">${esc(t2.title)}</div>
      <div class="t-sub">${esc(t2.artist)}</div>
    </div>
    <div class="t-right">${realTrackMoveHTML(entry.rank, entry.previous_rank)}${trackMarksHTML(t2)}</div>
  </div>`;
}
function realChartPlatformTabsHTML(action, selected){
  return `<div class="segmented" style="margin-top:9px;">
    ${PLATFORMS_UI.map(p=>`<button class="${p===selected?'active':''}" data-action="${action}" data-p="${p}">${PLATFORM_LABEL[p]}</button>`).join('')}
  </div>`;
}
// Bouton Premium placé juste là où le flou commence (pas besoin de descendre en bas) : lignes gratuites, bouton, puis toutes les lignes floutées jusqu'au 100e.
function lockBannerHTML(){
  return `<div class="hpad" style="margin:10px 0;"><button class="btn btn-primary btn-block" data-action="open-paywall">${tr('home.unlockTop100')}</button></div>`;
}
function withLockBanner(rows, freeLimit){
  if(isPro() || freeLimit==null || rows.length<=freeLimit) return rows.join('');
  return rows.slice(0,freeLimit).join('') + lockBannerHTML() + rows.slice(freeLimit).join('');
}
function realChartListHTML(entries, opts){
  opts = opts || {};
  if(!entries.length) return `<div class="empty-msg">Pas encore de classement synchronisé pour cette ville/plateforme.</div>`;
  // Pas de filtre par genre ici : Soundcharts ne donne pas de genre réel par morceau
  // pour les classements ville (voir note au-dessus de cityTrackGenre). On filtre en
  // revanche les entrées dont le titre n'a pas encore été résolu par le job de sync
  // (placeholder type "Track Loading...") — ne jamais montrer ça comme un vrai titre.
  const filtered = entries.filter(e=>{
    const t = e.tracks || {};
    return !isPlaceholderTitle(t.title);
  });
  if(!filtered.length) return `<div class="empty-msg">Classement en cours de synchronisation, revenez dans quelques minutes.</div>`;
  return withLockBanner(filtered.map((e,i)=>renderRealTrackRow(e,i, opts.freeLimit!=null && i>=opts.freeLimit)), opts.freeLimit);
}

/* ---------------------------- TRACK GENERATION --------------------------- */
const N_TRACKS = REAL_TRACKS.length;
let TRACKS = [];

function genHistory(rand, driftBias){
  const arr=[]; let v = 22 + rand()*35;
  for(let d=0; d<90; d++){
    const drift = driftBias * 0.045 * (d/90);
    v += (rand()-0.5)*3.4 + drift;
    v = clamp(v, 4, 99);
    arr.push(Math.round(v*10)/10);
  }
  return arr;
}
function pctChange(arr, back){
  const end = arr[arr.length-1];
  const start = arr[Math.max(0, arr.length-1-back)];
  if(start<=0.001) return 0;
  return Math.round(((end-start)/start)*1000)/10;
}

const CHART_GENRE_LABEL = {
  'afro-house':'Afro House', 'afro-tech':'Afro House', 'tribal-house':'Afro House',
  'house':'House', 'deep-house':'Deep House', 'organic-house':'Organic House',
  'melodic-house':'Melodic House & Techno', 'melodic-techno':'Melodic House & Techno',
  'tech-house':'Tech House', 'progressive-house':'Progressive House',
  'techno':'Techno (Peak Time / Driving)', 'minimal-deeptech':'Minimal / Deep Tech',
  'indie-dance':'Indie Dance',
};
function chartScoreFromRank(rank){
  // Beatport genre-chart position -> 0-100 "Chart Performance" input.
  // #1 ≈ 100, decaying smoothly; never the sole driver of DJ Score (see WEIGHTS).
  return clamp(108 - rank*4, 5, 100);
}

function buildTracks(){
  for(let i=0;i<N_TRACKS;i++){
    const rand = mulberry32(2000+i*97);
    const src = REAL_TRACKS[i];
    const title = src.title, artist = src.artist, label = src.label, chartRank = src.chartRank, coverUrl = src.cover;
    const genre = src.genre;
    const spotifyId = src.spotifyId || null; // verified real Spotify track ID (WebSearch, exact title+artist match) — null = not verified, stays on the generated preview
    const isRiser = rand() < 0.15; // ~15% of catalogue = early-stage "Next Big Track" candidates
    const driftBias = isRiser ? (5+rand()*8) : (rand()-0.42)*7;
    const history = genHistory(rand, driftBias);

    const releaseDaysAgo = isRiser ? Math.round(rand()*70) : Math.round(rand()*rand()*520); // risers are always fresh
    const releaseDate = new Date(TODAY.getTime() - releaseDaysAgo*86400000);
    const newness = clamp(100 - releaseDaysAgo/4.2, 2, 100);

    // Play-count growth (independent of the bounded 0-100 score curve above — a track's
    // spins can grow +200% while its normalized DJ Score index only moves within 0-100).
    const growth14d = isRiser ? Math.round((60 + rand()*220)*10)/10 : Math.round(((rand()-0.38)*60)*10)/10;
    const trend7d = Math.round((growth14d * (0.24+rand()*0.10))*10)/10;
    const trend30d = Math.round((growth14d * (1.25+rand()*0.35))*10)/10;
    const trend24h = Math.round((trend7d * (0.10+rand()*0.10))*10)/10;

    // Early-stage tracks are adopted by a smaller, spreading pool of DJs/markets —
    // that's exactly what keeps them out of the Top 15 while they're still emerging.
    const djsPlaying = isRiser ? Math.round(120 + rand()*520) : Math.round(180 + rand()*rand()*6200);
    const countriesCount = isRiser ? Math.round(8 + rand()*55) : Math.round(6 + rand()*88);
    const citiesCount = Math.round(countriesCount*1.6 + rand()*90);
    const clubsCount = rand()<0.62 ? Math.round(15+rand()*420) : null;

    // per-city affinity (drives country/city rankings independent of global score)
    const cityAffinity = {};
    const homeCities = pickN(CITIES, 4, rand);
    CITIES.forEach(c=>{ cityAffinity[c.id] = Math.round(rand()*55); });
    homeCities.forEach((c,idx)=>{ cityAffinity[c.id] = Math.round(70 + rand()*30 - idx*3); });

    const m = {
      freq: clamp(30 + (djsPlaying/6200)*70, 0, 100),
      growth: clamp(50 + growth14d*0.55, 0, 100),
      geo: clamp((countriesCount/95)*100, 0, 100),
      chart: chartScoreFromRank(chartRank),
      city: clamp((citiesCount/230)*100, 0, 100),
      newness: newness,
    };

    TRACKS.push({
      id: 'trk_'+i,
      title, artist, genre, label,
      chartSource:'Beatport', chartGenreName: CHART_GENRE_LABEL[genre] || (genreById(genre)?genreById(genre).name:''), chartRank,
      releaseDate, releaseDaysAgo,
      djsPlaying, countriesCount, citiesCount, clubsCount,
      cityAffinity,
      history,
      trend24h: Math.round(trend24h*10)/10,
      trend7d, trend30d, growth14d,
      m,
      djScore: 0, // computed
      coverSeed: Math.floor(rand()*9999),
      coverUrl,
      spotifyId,
    });
  }
}
buildTracks();

/* ---------------------------- SCORING ENGINE ----------------------------- */
// Default coefficients per spec
const DEFAULT_WEIGHTS = { freq:30, growth:20, geo:15, chart:15, city:10, newness:10 };
let WEIGHTS = {...DEFAULT_WEIGHTS};

function recomputeScores(){
  const wsum = Object.values(WEIGHTS).reduce((a,b)=>a+b,0) || 1;
  TRACKS.forEach(t=>{
    const raw = t.m.freq*WEIGHTS.freq + t.m.growth*WEIGHTS.growth + t.m.geo*WEIGHTS.geo +
                t.m.chart*WEIGHTS.chart + t.m.city*WEIGHTS.city + t.m.newness*WEIGHTS.newness;
    t.djScore = Math.round(clamp(raw/wsum, 1, 100));
  });
  TRACKS.sort((a,b)=>b.djScore-a.djScore);
  TRACKS.forEach((t,i)=> t.rank = i+1 );
  // Next Big Tracks: strong 14d growth, not already top 15
  TRACKS.forEach(t=> t.isNextBig = (t.growth14d>=55 && t.rank>15) );
}
recomputeScores();

function trendScoreOf(t){
  // Emphasizes velocity + newness + geographic spread acceleration
  return Math.round(clamp(t.growth14d*0.55 + t.m.newness*0.25 + t.m.geo*0.20, -100, 400));
}
function trendLabel(growth14d){
  if(growth14d>=150) return {txt:'EXPLODING', cls:'exploding', icon:'🚀'};
  if(growth14d>=80) return {txt:'HOT', cls:'hot', icon:'🔥'};
  if(growth14d>=30) return {txt:'RISING', cls:'rising', icon:'↑'};
  return {txt:'STEADY', cls:'steady', icon:'→'};
}
function trendBadge(pct){
  const abs = Math.abs(pct);
  let icon = '→', cls='flat';
  if(pct>=25){icon='🚀';cls='up';}
  else if(pct>=15){icon='🔥';cls='up';}
  else if(pct>=1){icon='↑';cls='up';}
  else if(pct<=-1){icon='↓';cls='down';}
  return `<span class="t-trend ${cls}">${icon} ${fmtPct(Math.round(pct))}</span>`;
}

/* ---------------------------- AUTH + PERSISTENCE (Supabase) ----------------
   Real accounts via Supabase Auth (email+password), with cross-session
   storage of the DJ profile, Radar favorites and language in our own
   `profiles` table (RLS-protected — each user can only ever read/write their
   own row). Session tokens live in localStorage so a signed-in DJ stays
   signed in across app restarts. A guest (no account) stays local-only and
   simply won't be remembered next launch — that's the one case where nothing
   is persisted, and it's intentional. */
const AUTH_SESSION_KEY = 'pulse_auth_session';
let authSession = null; // { access_token, refresh_token, expires_at(ms), userId, email }
let PERSIST_READY = false;

function getStoredSession(){
  try{ const raw = localStorage.getItem(AUTH_SESSION_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setStoredSession(session){
  try{
    if(session) localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));
    else localStorage.removeItem(AUTH_SESSION_KEY);
  }catch(e){ /* storage unavailable — session just won't survive a restart */ }
}
function applyAuthResponse(data){
  authSession = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + ((data.expires_in || 3600) * 1000),
    userId: data.user && data.user.id,
    email: data.user && data.user.email,
  };
  setStoredSession(authSession);
}
function authHeaders(session){
  return { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' };
}

async function authSignUp(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { ...SUPABASE_HEADERS, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw { code: data.error_code || data.code, message: data.msg || data.error_description || data.message };
  return data; // access_token present only if email confirmation is OFF
}
async function authSignIn(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { ...SUPABASE_HEADERS, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw { code: data.error_code || data.code, message: data.msg || data.error_description || data.message };
  return data;
}
async function authSignOut(){
  if(authSession && authSession.access_token){
    try{
      await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: { ...SUPABASE_HEADERS, Authorization: `Bearer ${authSession.access_token}` },
      });
    }catch(e){ /* best-effort — we still clear the local session below */ }
  }
  authSession = null;
  setStoredSession(null);
}
// Suppression de compte (exigée par Google Play) : appelle la fonction SQL delete_my_account (voir publication/delete_my_account.sql).
async function deleteMyAccount(){
  const s = await ensureFreshSession();
  if(!s){ state.confirmDelete = false; toast(tr('profile.deleteFail')); renderView(); return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/delete_my_account`, { method:'POST', headers: authHeaders(s), body:'{}' });
    if(!res.ok) throw new Error(res.status);
    authSession = null; setStoredSession(null);
    state.confirmDelete = false; state.user = null; state.view = 'home';
    authMode = 'login'; authError = null;
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    renderAuthScreen();
    toast(tr('toast.accountDeleted'));
  }catch(e){ state.confirmDelete = false; toast(tr('profile.deleteFail')); renderView(); }
}
// Refreshes the access token if it's near expiry. Returns null (never
// throws) if there's no usable session — callers fall back to local-only.
async function ensureFreshSession(){
  if(!authSession) return null;
  if(authSession.expires_at - Date.now() > 30000) return authSession;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { ...SUPABASE_HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: authSession.refresh_token }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error('refresh_failed');
    applyAuthResponse(data);
    return authSession;
  }catch(e){
    authSession = null;
    setStoredSession(null);
    return null;
  }
}

async function initPersistence(){
  const stored = getStoredSession();
  if(stored && stored.access_token){
    authSession = stored;
    const session = await ensureFreshSession();
    if(session) await loadPersistedState();
  }
  PERSIST_READY = true;
}

async function loadPersistedState(){
  const session = await ensureFreshSession();
  if(!session) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${session.userId}&select=*`, { headers: authHeaders(session) });
    const rows = await res.json();
    const row = Array.isArray(rows) ? rows[0] : null;
    if(row){
      state.user = {
        name: row.name || '', email: session.email, isPro: !!row.is_pro,
        artistName: row.artist_name || '', country: row.country || '', city: row.city || '',
        genres: row.genres || [], instagram: row.instagram || '', soundcloud: row.soundcloud || '',
      };
      if(Array.isArray(row.fav_tracks)) state.favTracks = new Set(row.fav_tracks);
      if(row.lang && row.lang !== state.lang) setLang(row.lang);
    } else if(state.user){
      // First save for a brand-new account — no row yet, create it.
      await persistState();
    }
  }catch(e){ /* non-fatal — app keeps working from in-memory state */ }
}

async function persistState(){
  const session = await ensureFreshSession();
  if(!session || !state.user) return;
  const payload = {
    id: session.userId,
    name: state.user.name || '', artist_name: state.user.artistName || '',
    country: state.user.country || '', city: state.user.city || '',
    genres: state.user.genres || [], instagram: state.user.instagram || '', soundcloud: state.user.soundcloud || '',
    is_pro: !!state.user.isPro, fav_tracks: [...state.favTracks], lang: state.lang,
    updated_at: new Date().toISOString(),
  };
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
      method: 'POST',
      headers: { ...authHeaders(session), Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify(payload),
    });
  }catch(e){ /* non-fatal — next successful save catches up */ }
}

/* ---------------------------- NATIVE SHELL (Capacitor iOS/Android) ---------------------------- */
/* This same index.html is also the web root of the real iOS/Android app (Capacitor).
   On web / Send / the claude.ai Artifact, window.Capacitor doesn't exist, so everything
   here just no-ops and the page behaves exactly as before. Inside the native app it wires
   up real OS chrome: status bar color, hiding the splash screen once the UI is ready, and
   the Android hardware/gesture back button (closing an open overlay first, exiting the app
   only when there's nothing left to close). */
function initNativeShell(){
  try{
    const C = window.Capacitor;
    if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
    const P = C.Plugins || {};
    if(P.StatusBar){
      P.StatusBar.setStyle({ style: 'DARK' }).catch(()=>{});
      P.StatusBar.setBackgroundColor({ color: '#0a0a0f' }).catch(()=>{});
    }
    if(P.App){
      P.App.addListener('backButton', ({ canGoBack }) => {
        const openOverlay = ['trackOverlay','genreOverlay','paywallOverlay']
          .map(id => document.getElementById(id))
          .find(el => el && !el.classList.contains('hidden'));
        if(openOverlay){
          if(openOverlay.id==='trackOverlay') closeTrack();
          else { openOverlay.classList.add('hidden'); renderView(); }
          return;
        }
        if(canGoBack) window.history.back();
        else P.App.exitApp();
      });
    }
    // Give the first render a beat to paint before dropping the splash screen.
    setTimeout(()=>{ if(P.SplashScreen) P.SplashScreen.hide().catch(()=>{}); }, 350);
  }catch(e){ /* non-fatal — app stays fully usable without native chrome */ }
}

/* ---------------------------- COVER RENDER --------------------------------
   No licensed artwork is available in this prototype (real label covers are
   copyrighted and there's no image API wired up), so each track gets a
   unique generative cover instead — layered gradients + a genre-specific
   visual motif, seeded by the track so it's stable and one-of-a-kind. */
function coverStyle(genreId, seed){
  const g = genreById(genreId);
  const rand = mulberry32(seed+777);
  const angle = Math.round(rand()*360);
  const gx = 12+Math.round(rand()*70), gy = 12+Math.round(rand()*70);
  const hue2 = Math.round((seed*53)%360);
  const accent = `hsla(${hue2},70%,52%,0.56)`;
  const grain = `repeating-radial-gradient(circle at 3px 3px, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1.6px, transparent 7px)`;
  const glow = `radial-gradient(circle at ${gx}% ${gy}%, ${accent}, transparent 62%)`;
  const base = `linear-gradient(${angle}deg, ${g.color}f2 0%, #0a0a10 145%)`;

  let motif = '';
  if(genreId==='techno' || genreId==='minimal-deeptech'){
    // stark monochrome scanlines — hard, driving genres
    motif = `repeating-linear-gradient(${(angle+90)%360}deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 5px), `;
  } else if(genreId==='indie-dance'){
    // retro synthwave horizon line
    motif = `linear-gradient(0deg, transparent 44%, rgba(255,255,255,.25) 45%, rgba(255,255,255,.25) 46%, transparent 47%), `;
  } else if(genreId==='tech-house'){
    // bold halftone dots
    motif = `radial-gradient(rgba(255,255,255,.16) 1.2px, transparent 1.3px), `;
  } else if(genreId==='afro-house'||genreId==='afro-tech'||genreId==='tribal-house'||genreId==='organic-house'){
    // warm organic glow, earthy tones
    motif = `radial-gradient(circle at ${100-gx}% ${100-gy}%, rgba(255,196,120,.32), transparent 58%), `;
  } else if(genreId==='melodic-house'||genreId==='melodic-techno'||genreId==='progressive-house'){
    // soft diagonal light streak — atmospheric genres
    motif = `linear-gradient(${(angle+35)%360}deg, transparent 40%, rgba(255,255,255,.14) 50%, transparent 60%), `;
  }
  const size = (genreId==='tech-house') ? 'background-size: 9px 9px, auto, auto, auto;' : '';
  return `background-image:${motif}${grain}, ${glow}, ${base}; ${size}`;
}
function coverInitials(title){
  return title.replace(/\(.*?\)/g,'').trim().split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
// Pochettes Deezer (conditions non commerciales) exclues ; images Soundcharts (licence) autorisées ; les pochettes Beatport du catalogue fixe sont rétablies ; le reste vient d'Apple (voir pumpCoverQueue) ; : on utilise l'artwork Apple à la place (voir pumpCoverQueue).
function safeCover(u){ return (u && !/dzcdn\.net|deezer\.com/i.test(u)) ? u : null; }
function coverHTML(t, big){
  const playing = state.playingId===t.id;
  // Real Beatport cover art is hotlinked from Beatport's own public CDN (the same
  // thumbnail URLs their site serves) — if it ever fails to load, the generative
  // artwork underneath shows through instead of a broken image.
  const img = safeCover(t.coverUrl) ? `<img src="${safeCover(t.coverUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;">` : '';
  // Badge visible AVANT même d'appuyer sur play quand on a un identifiant
  // vérifié (Spotify/YouTube, jamais deviné) — sinon seulement une fois
  // qu'Apple Music a confirmé un extrait (ça, ça ne se sait qu'après coup).
  const verified = !!(t.spotifyId || t.youtubeId);
  const spotifyBadge = (verified || t.itunesPreviewUrl) ? `<div style="position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:#fc3d62;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 0 2px rgba(0,0,0,.35);" title="${verified?'Morceau vérifié (Spotify/YouTube)':'Extrait audio réel disponible (Apple Music)'}">✓</div>` : '';
  return `<div class="cover-wrap">
    <div class="cover${big?' lg':''}" ${!safeCover(t.coverUrl)?`data-lazycover="${t.id}"`:''} style="${coverStyle(t.genre, t.coverSeed)}position:relative;overflow:hidden;">${coverInitials(t.title)}${img}${spotifyBadge}</div>
    <button class="play-overlay${big?' lg':''}${playing?' playing':''}" data-action="toggle-play" data-id="${t.id}" aria-label="Écouter l'extrait">${playing?'⏸':'▶'}</button>
  </div>`;
}

/* ---------------------------- AUDIO PREVIEW ENGINE -------------------------
   No licensed audio is available in this prototype, so each track gets a short
   procedurally generated preview loop (seeded by the track) instead of silence
   or a fake "real" file — it lets the play/pause flow be demoed honestly. */
const GENRE_BPM = {'afro-house':122,'afro-tech':123,'house':124,'deep-house':121,'organic-house':120,'melodic-house':123,'melodic-techno':124,'tech-house':125,'progressive-house':122,'techno':130,'minimal-deeptech':127,'indie-dance':118,'hard-techno':142,'funky-house':124,'indie-tech':124,'disco-house':122,'tribal-house':120};
// Each genre gets its own instrumentation character (waveforms, filter, groove,
// percussion density, melodic vs. atmospheric) so the preview actually feels
// adapted to the track's genre instead of one generic loop for everything.
const GENRE_SOUND = {
  'afro-house':      {bassWave:'sine',     bassCutoff:620, padWave:'sine',     padGain:0.09, hatProb:0.85, percProb:0.55, kickDecay:0.16, swing:0.10, mode:'pad'},
  'afro-tech':        {bassWave:'sine',     bassCutoff:560, padWave:'sine',     padGain:0.07, hatProb:0.95, percProb:0.75, kickDecay:0.14, swing:0.12, mode:'pad'},
  'tribal-house':     {bassWave:'sine',     bassCutoff:600, padWave:'sine',     padGain:0.07, hatProb:0.9,  percProb:0.85, kickDecay:0.16, swing:0.14, mode:'pad'},
  'house':            {bassWave:'sawtooth', bassCutoff:520, padWave:'triangle', padGain:0.10, hatProb:0.75, percProb:0.15, kickDecay:0.17, swing:0.04, mode:'pad'},
  'deep-house':       {bassWave:'sine',     bassCutoff:420, padWave:'triangle', padGain:0.11, hatProb:0.55, percProb:0.10, kickDecay:0.19, swing:0.06, mode:'pad'},
  'organic-house':    {bassWave:'sine',     bassCutoff:380, padWave:'triangle', padGain:0.11, hatProb:0.40, percProb:0.10, kickDecay:0.20, swing:0.05, mode:'arp', arpWave:'triangle'},
  'melodic-house':    {bassWave:'sine',     bassCutoff:460, padWave:'triangle', padGain:0.12, hatProb:0.55, percProb:0.10, kickDecay:0.19, swing:0.03, mode:'arp', arpWave:'triangle'},
  'melodic-techno':   {bassWave:'sawtooth', bassCutoff:340, padWave:'sawtooth', padGain:0.10, hatProb:0.70, percProb:0.15, kickDecay:0.20, swing:0.02, mode:'arp', arpWave:'sawtooth'},
  'tech-house':       {bassWave:'sawtooth', bassCutoff:500, padWave:'triangle', padGain:0.06, hatProb:0.85, percProb:0.30, kickDecay:0.15, swing:0.09, mode:'pad'},
  'progressive-house':{bassWave:'sawtooth', bassCutoff:400, padWave:'sawtooth', padGain:0.11, hatProb:0.70, percProb:0.10, kickDecay:0.20, swing:0.02, mode:'arp', arpWave:'triangle'},
  'techno':           {bassWave:'square',   bassCutoff:300, padWave:'sawtooth', padGain:0.06, hatProb:0.95, percProb:0.20, kickDecay:0.22, swing:0.0,  mode:'pad'},
  'minimal-deeptech':  {bassWave:'square',   bassCutoff:260, padWave:'triangle', padGain:0.05, hatProb:0.80, percProb:0.35, kickDecay:0.14, swing:0.06, mode:'pad'},
  'indie-dance':      {bassWave:'square',   bassCutoff:700, padWave:'square',   padGain:0.07, hatProb:0.65, percProb:0.10, kickDecay:0.16, swing:0.0,  mode:'arp', arpWave:'square'},
};
// 4 demo profiles for real-city chart tracks (no genre data from Soundcharts to go
// on), built for MAXIMUM audible contrast rather than genre realism — different
// kick waveform/pitch (the loudest, most frequent sound in the loop, so it has to
// differ too, not just the background pad/bass), a wide BPM spread (98-132, not a
// tight 118-130 dance-music range), and pad vs. arp mode.
const DEMO_PROFILES = [
  { bpm:90,  kickWave:'sine',     kickFreqStart:120, kickFreqEnd:32, kickDecay:0.30, bassWave:'sine',     bassCutoff:320, padWave:'triangle', padGain:0.14, hatProb:0.22, percProb:0.05, swing:0.05, mode:'pad' },
  { bpm:138, kickWave:'square',   kickFreqStart:180, kickFreqEnd:62, kickDecay:0.10, bassWave:'square',   bassCutoff:260, padWave:'sawtooth', padGain:0.05, hatProb:0.97, percProb:0.20, swing:0.0,  mode:'pad' },
  { bpm:112, kickWave:'triangle', kickFreqStart:150, kickFreqEnd:48, kickDecay:0.20, bassWave:'sine',     bassCutoff:460, padWave:'triangle', padGain:0.11, hatProb:0.55, percProb:0.10, swing:0.03, mode:'arp', arpWave:'triangle' },
  { bpm:124, kickWave:'sawtooth', kickFreqStart:165, kickFreqEnd:55, kickDecay:0.13, bassWave:'sawtooth', bassCutoff:620, padWave:'sine',     padGain:0.07, hatProb:0.88, percProb:0.90, swing:0.16, mode:'pad' },
];
// Each profile now has its own, never-repeated kick waveform (sine / square /
// triangle / sawtooth) — the kick is the loudest, most frequent hit in the loop,
// so two profiles sharing a waveform there is what made them sound alike even
// with every other parameter varied. Also widened the BPM spread further.
const PREVIEW_MS = 24000;
let audioCtx = null, playTimer = null, progressTimer = null, playMasterGain = null;

function ensureAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function seededScaleFreqs(seed){
  const root = 26 + (seed%12); // semitone offset, kept in a low/mid register
  const steps = [0,3,5,7,10,12,15,19]; // minor-pentatonic-ish, generally pleasant
  return steps.map(s => 440*Math.pow(2, (root+s-57)/12));
}
function playTrack(t){
  stopPlayback();
  let ctx;
  try{ ctx = ensureAudioCtx(); if(ctx.state==='suspended') ctx.resume(); }
  catch(e){ toast('Lecture audio indisponible sur ce navigateur.'); return; }

  const prof = t.demoProfile || GENRE_SOUND[t.genre] || GENRE_SOUND['afro-house'];
  // ±12% tempo jitter seeded per track, so even two tracks sharing a profile
  // don't play at the exact same speed.
  const bpmJitter = 0.88 + mulberry32((t.coverSeed||0)+7)()*0.24;
  const bpm = Math.round((t.demoBpm || GENRE_BPM[t.genre] || 123) * bpmJitter);
  const stepDur = 60/bpm/4;
  const freqs = seededScaleFreqs(t.coverSeed);
  const rnd = mulberry32(t.coverSeed+1);

  // Care, MikroBeats, Aaron Sevilla" — that the exact beatport-style string

  // itself is there. Try the exact title+artist first, then a cleaned-up
  // title with just the lead artist, then the cleaned title alone — each
  // extra attempt only runs if the previous one found nothing, so a track
  // that matches on the first try costs exactly one request. The first,

  // often the difference between a real preview and the generated fallback.
  // Enlève TOUS les groupes "(...)" / "[...]" en fin de titre, pas juste le
  // dernier — "Jamaican (Bam Bam) (Extended Mix)" avait avant seulement
  // "(Extended Mix)" retiré ; on boucle maintenant pour aussi retirer
  // "(Bam Bam)" si besoin. Enlève aussi un suffixe "- Extended Mix" / "-
  // Radio Edit" etc. qui n'est pas entre parenthèses chez certains labels.

    cleanTitle !== t.title || leadArtist !== t.artist ? `${cleanTitle} ${leadArtist}` : null,

    // Beatport cite parfois les artistes dans un ordre différent de celui
    // retenu par Apple : on retente avec chaque autre artiste crédité avant
    // de renoncer (plafonné à 3 au total pour ne pas multiplier les requêtes
    // sur un morceau à 6 featurings).
    ...artistList.slice(1,3).map(a => `${cleanTitle} ${a}`),

  let hit = null, anyFailed = false;
  for(let i=0;i<attempts.length;i++){

/* Pochettes manquantes (la synchro n'en a qu'une partie) : complétées via l'artwork Apple dès que la ligne devient visible. */
const coverQueue = []; let coverBusy = false;
const coverObserver = typeof IntersectionObserver!=='undefined' ? new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ coverObserver.unobserve(e.target); coverQueue.push(e.target); } });
  pumpCoverQueue();
},{rootMargin:'200px'}) : null;
async function pumpCoverQueue(){
  if(coverBusy) return; coverBusy = true;
  await coversReady;
  while(coverQueue.length){
    const el = coverQueue.shift(); const t = realTracksCache[el.dataset.lazycover] || TRACKS.find(x=>x.id===el.dataset.lazycover);
    if(!t || !el.isConnected || safeCover(t.coverUrl)) continue;
    const hit = await lookupCoverCheap(t);
    if(hit && hit.artwork){
      t.coverUrl = hit.artwork;
      const img = new Image(); img.alt=''; img.referrerPolicy='no-referrer';
      img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;';
      img.onload = ()=>{ if(el.isConnected) el.insertBefore(img, el.firstChild); };
      img.src = hit.artwork;
    }
    if(coverUsedNet) await new Promise(r=>setTimeout(r,3200)); // ménage l'API Apple (≈ 19 requêtes/min)
  }
  coverBusy = false;
}
// Applique tout de suite les pochettes déjà préparées (covers.json) aux lignes affichées : aucun défilement ni requête nécessaire.
function applyStoredCovers(){
  document.querySelectorAll('[data-lazycover]').forEach(el=>{
    if(el.querySelector('img')) return;
    const t = realTracksCache[el.dataset.lazycover] || TRACKS.find(x=>x.id===el.dataset.lazycover);
    if(!t) return;
    const sh = itStoreGet(t), art = (sh && sh.artwork) || artOnly[itKey(t)];
    if(!art) return;
    t.coverUrl = art;
    const img = new Image(); img.alt=''; img.referrerPolicy='no-referrer';
    img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;';
    img.onload = ()=>{ if(el.isConnected && !el.querySelector('img')) el.insertBefore(img, el.firstChild); };
    img.src = art;
  });
}
coversReady.then(applyStoredCovers);
function scanLazyCovers(){
  applyStoredCovers();
  if(!coverObserver) return;
  document.querySelectorAll('[data-lazycover]:not([data-cv])').forEach(el=>{ el.dataset.cv='1'; coverObserver.observe(el); });
}
(function(){
  const start = ()=>{ let tm; new MutationObserver(()=>{ clearTimeout(tm); tm = setTimeout(scanLazyCovers,80); }).observe(document.body,{childList:true,subtree:true}); scanLazyCovers(); };
  if(typeof MutationObserver==='undefined') return;
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
async function togglePlay(id, forcedSource){
  if(plQ && !String(id).startsWith('plq:')) plQ = null;
  const t = TRACKS.find(x=>x.id===id) || realTracksCache[id];
  if(!t) return;
  markSeen(t);
  state.noPreview = null;
  const src = forcedSource || 'apple';
  if(src==='spotify'){
    if(t.spotifyId){ stopPlayback(); state.playingId = id; state.playingEmbed = 'spotify'; updatePlayerUI(); return; }
    window.open(externalSearchUrl('Spotify', t), '_blank', 'noopener'); return;
  }
  if(src==='youtube'){
    if(!t.youtubeId) t.youtubeId = ytLookup(t.title, t.artist);
    if(t.youtubeId){ stopPlayback(); state.playingId = id; state.playingEmbed = 'youtube'; updatePlayerUI(); return; }
    window.open(externalSearchUrl('YouTube', t), '_blank', 'noopener'); return;
  }
  if(state.playingId===id){ stopPlayback(); return; }
  // Priority order (revised: a confirmed mobile test showed the hidden
  // Spotify controller can report "playing" while staying silent — a
  // cross-origin iframe's autoplay can be blocked by the phone's browser
  // even when the iFrame API's own event says playback started, and there
  // is no way to detect that from here. A real <audio> tag has none of
  // that risk and is the one method already confirmed audible on iPhone,
  // so it now comes first for every track, verified ID or not):
  //  1. An iTunes preview already resolved earlier this session for THIS
  //     track — smoothest (single tap, no embed) and already verified.
  //  2. A fresh iTunes Search API lookup, tried for EVERY track including
  //     ones with a verified spotifyId/youtubeId. For those, the title and
  //     artist used for the query are our own clean catalogue data (not
  //     scraped/guessed text), so the match is high-confidence — and the
  //     result is a real, branding-free 30s <audio> preview.
  //  3. A verified identifier (t.spotifyId / t.youtubeId) — used only when
  //     iTunes genuinely has no match for that exact title/artist. Still
  //     guaranteed-correct, but the Spotify hidden-controller path can be
  //     silent on some mobile browsers, so it's now the fallback rather
  //     than the first choice.
  //  4. The generated placeholder loop, clearly labelled, as a last resort.
  if(t.itunesPreviewUrl){
    stopPlayback();
    state.playingId = id;
    state.playingItunes = true;
    updatePlayerUI();
    const el = ensureItunesAudioEl();
    el.src = t.itunesPreviewUrl;
    el.play().catch(()=>{});
    return;
  }
  if(!t.itunesChecked){
    // Prime the shared <audio> element with this exact tap's user gesture
    // BEFORE the network lookup below — see ensureItunesAudioEl for why
    // this is what makes the real preview actually audible on an iPhone,
    // not just found.
    stopPlayback();
    state.playingId = id;
    state.itunesLoading = true;
    updatePlayerUI();
    const el = ensureItunesAudioEl();
    try{ el.src = SILENT_AUDIO_DATA_URI; el.play().catch(()=>{}); }catch(e){ /* priming is best-effort, fire-and-forget: some phones never settle this promise, and awaiting it was blocking ALL playback */ }
    const hit = await lookupItunesPreview(t);
    // Only lock this track to the generated preview for the rest of the
    // session once Apple's answer is a confirmed negative (itunesCache has
    // an entry for it). A network failure leaves itunesCache unset on
    // purpose — t.itunesChecked stays false too, so the next tap gets a
    // fresh attempt instead of being stuck because of a one-off hiccup.
    if(itunesCache[t.id] !== undefined) t.itunesChecked = true;
    if(state.playingId !== id) return; // listener moved on during the lookup
    state.itunesLoading = false;
    if(hit && hit.previewUrl){
      t.itunesPreviewUrl = hit.previewUrl;
      t.itunesTrackUrl = hit.trackViewUrl;
      state.playingItunes = true;
      updatePlayerUI();
      el.src = hit.previewUrl;
      el.play().catch(()=>{});
      return;
    }
    // No iTunes match: fall through below to try spotifyId/youtubeId, then
    // the generated loop as a last resort.
  }
  if(t.spotifyId){
    // Widget Spotify officiel, affiché tel quel (logo compris) — voir la
    // note au-dessus de spotifyController pour pourquoi un lecteur caché a
    // été abandonné.
    stopPlayback();
    state.playingId = id;
    state.playingEmbed = 'spotify';
    updatePlayerUI();
    return;
  }
  if(t.youtubeId){
    stopPlayback();
    state.playingId = id;
    state.playingEmbed = 'youtube';
    updatePlayerUI();
    return;
  }
  // Already checked iTunes earlier this session (no match) and no verified
  // ID to fall back on — go straight to the generated preview, clearly
  // labelled "extrait démo" in the mini player (never claims to be the
  // real recording).
  // Morceau d'un vrai classement sans extrait Apple : pas de boucle synthétique (ce n'est pas le bon son).
  if(t.isRealCity){ stopPlayback(); state.noPreview = {title:t.title, artist:t.artist}; updatePlayerUI(); return; }
  state.playingId = null;
  playTrack(t);
}

/* ---- File d'attente de playlist : Mix aléatoire / Mix dans l'ordre jouent dans le lecteur intégré (YouTube ou extrait Apple), sans ouvrir MIX ---- */
let plQ = null;
function plQStart(name, shuffle){
  const items = (plMap[name]||[]).slice(); if(!items.length){ toast('Playlist vide'); return; }
  if(shuffle) items.sort(()=>Math.random()-.5);
  djAutoStop(true); plQ = {items, i:0, dir:1, err:0}; plQPlay();
}
async function plQPlay(tries){
  const q = plQ; if(!q) return; tries = tries||0; const n = q.items.length, f = q.items[((q.i%n)+n)%n], apple = false, yt = ytLookup(f.title, f.artist); // lecture intégrée : YouTube seulement
  const skip = msg => { if(tries>=n){ plQ = null; stopPlayback(); toast(msg); return; } q.i += q.dir; plQPlay(tries+1); };
  if(!apple && !yt) return skip('Aucun titre avec lecteur intégré');
  const id = 'plq:'+f.title+'|'+f.artist;
  realTracksCache[id] = {id, title:f.title, artist:f.artist, isRealCity:true, youtubeId:yt||null, coverUrl:f.cover||null};
  await togglePlay(id, apple ? 'apple' : 'youtube');
  if(plQ===q && state.noPreview && state.noPreview.title===f.title) skip('Aucun extrait trouvé pour cette playlist'); // ni extrait Apple ni vidéo : titre suivant
}
function plQNext(d){ if(!plQ) return; plQ.dir = d||1; plQ.i += plQ.dir; plQPlay(); }
const plqBtns = () => plQ ? '<button data-action="plq-prev" title="Précédent">⏮</button><button data-action="plq-next" title="Suivant">⏭</button>' : '';

  const h = document.getElementById('plqYT'); if(!plQ || !h || h.dataset.m) return;
  const t = realTracksCache[state.playingId]; if(!t || !t.youtubeId) return; h.dataset.m = '1';

    new YT.Player(h.firstChild, {width:'100%', height:'152', videoId:t.youtubeId, playerVars:{autoplay:1, playsinline:1, rel:0}, events:{
      onReady:e=>e.target.playVideo(),
      onStateChange:e=>{ if(e.data===1 && plQ) plQ.err = 0; if(e.data===0) plQNext(); },
      onError:()=>{ if(plQ && ++plQ.err > plQ.items.length){ plQ = null; stopPlayback(); toast('Lecture impossible'); } else plQNext(); } }});
  });
}

/* ---------------------------- TOAST --------------------------------------- */
function toast(msg){
  const c = document.getElementById('toast-container');
  const d = document.createElement('div');
  d.className='toast'; d.textContent=msg;
  c.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),300); }, 2200);

function trackMatchesGenreFilter(t){
  if(state.genreFilters.size===0) return true;
  return state.genreFilters.has(t.genre);
}
function setQuickGenre(key){
  state.genreFilters = new Set();
  if(key==='all'){ /* empty = all */ }
  else if(key==='melodic'){ state.genreFilters.add('melodic-house'); state.genreFilters.add('melodic-techno'); }
  else if(key==='afro-house'){ state.genreFilters.add('afro-house'); }
  else if(genreById(key)){ state.genreFilters.add(key); }
  renderView();
}
function quickGenreActive(key){
  const s = state.genreFilters;
  if(key==='all') return s.size===0;
  if(key==='melodic') return s.size===2 && s.has('melodic-house') && s.has('melodic-techno');
  if(key==='afro-house') return s.size===1 && s.has('afro-house');
  return s.size===1 && s.has(key);
}
// Which of the quick-chip genres (if any) is the ONLY active filter right
// now — these are the ones with a real, synced Beatport genre chart (see
// genre_chart_entries / activeRealGenreKey below). A broader/combined
// selection made via "+ de genres" still falls back to the static catalogue.
// "House" et "Techno" retirés de ce groupe le 2026-10-04 avec le reste du
// catalogue de ces 2 genres (demande explicite) — plus de chip, plus de
// chart réel accessible depuis l'app pour ces 2-là.
// Genres qui ont un vrai Top 100 synchronisé (indie-tech n'a pas de classement chez Beatport : reste sur le message d'attente).

async function loadHomeCityList(){

  const host = document.getElementById('homeCityList');
  if(!host) return;
  // Musique électronique uniquement : on garde les morceaux du classement ville qui figurent dans nos classements électro
  // (genres Beatport + classement électro du pays) ; s'il y en a trop peu, on affiche le classement électro du pays.
  const cc = (cityById(appCityId)||{}).country;
  const [uni, cEntries] = await Promise.all([loadElectronicUniverse(), fetchCountryElectronic(cc)]);
  if(cityViewId()!==appCityId) return;

  else if(cEntries.length){ shown = cEntries; note = 'Pas assez de morceaux électro dans le classement de cette ville : voici le classement électro du pays.'; }
  if(!shown.length){

    const demo = TRACKS.filter(trackMatchesGenreFilter).slice().sort((a,b)=>(b.cityAffinity[appCityId]||0)-(a.cityAffinity[appCityId]||0));

/* ---------------------------- ÉLECTRO PAR PAYS ----------------------------
   Classement électro (Dance/Electronic) Apple Music ou Shazam de chaque pays, synchronisé par la fonction Supabase
   (table country_electronic_entries). La vue Pays n'affiche plus que de la musique électronique. */
const countryElectroCache = {};
async function fetchCountryElectronic(cc){
  if(!cc) return [];
  if(countryElectroCache[cc]) return countryElectroCache[cc];
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/country_electronic_entries?country_code=eq.${cc}&select=rank,previous_rank,title,artist_name,cover_url&order=rank.asc&limit=100`, { headers: SUPABASE_HEADERS });
    const rows = await res.json();
    const entries = (Array.isArray(rows)?rows:[]).map(r=>({ rank:r.rank, previous_rank:r.previous_rank, tracks:{ title:r.title, artist_name:r.artist_name, cover_url:r.cover_url, youtube_id:null } }));
    if(entries.length) countryElectroCache[cc] = entries;
    return entries;
  }catch(e){ return []; }
}
function coreTitle(s){
  return normText(String(s||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'').replace(/\s*-\s*(extended|radio|original|club|vip|remix|edit|mix)\b.*$/i,'')).trim();
}
let electronicUniversePromise = null;
function loadElectronicUniverse(){
  if(electronicUniversePromise) return electronicUniversePromise;
  electronicUniversePromise = (async()=>{
    const map = new Map();
    const add = (t,a)=>{ const k = coreTitle(t); if(!k) return; const arr = map.get(k) || []; arr.push(normText(a)); map.set(k,arr); };
    for(const table of ['genre_chart_entries','country_electronic_entries']){
      for(let off=0; off<6000; off+=1000){
        try{
          const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=title,artist_name&order=id.asc&limit=1000&offset=${off}`, { headers: SUPABASE_HEADERS });
          const rows = await res.json();
          if(!Array.isArray(rows) || !rows.length) break;
          rows.forEach(r=>add(r.title, r.artist_name));
          if(rows.length<1000) break;
        }catch(e){ break; }
      }
    }
    return map;
  })();
  return electronicUniversePromise;
}
function isElectronicEntry(map, t){
  const arr = map.get(coreTitle(t.title));
  if(!arr) return false;
  const words = sigWords(t.artist_name||'', 2);
  return words.length===0 || arr.some(a=>words.some(w=>a.includes(w)));
}

// Real per-genre Top 100 (Monde/Pays), synced daily from Beatport's own
// genre charts via Soundcharts — see genre_chart_entries table. Replaces the
// old behaviour of filtering the ~100-track static catalogue by genre, which
// left genres like Afro Tech with only 3 tracks instead of a real 100.
// Shaped exactly like fetchRealCityChart's entries ({rank, previous_rank,
// tracks:{...}}) so the existing realChartListHTML/renderRealTrackRow can
// render it as-is, no new UI code needed.
const genreChartCache = {}; // genre_key -> entries[] (session-only)
async function fetchGenreChart(genreKey){
  if(genreChartCache[genreKey]) return genreChartCache[genreKey];
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/genre_chart_entries?genre_key=eq.${genreKey}&select=rank,previous_rank,title,artist_name,cover_url&order=rank.asc&limit=100`,
      { headers: SUPABASE_HEADERS }
    );
    const rows = await res.json();
    const entries = (rows||[]).map(r=>({
      rank: r.rank,
      previous_rank: r.previous_rank,
      tracks: { title: r.title, artist_name: r.artist_name, cover_url: r.cover_url, youtube_id: null },
    }));
    genreChartCache[genreKey] = entries;
    return entries;
  } catch(e){
    genreChartCache[genreKey] = [];
    return [];
  }
}
async function loadHomeGenreChartList(){
  const genreKey = activeRealGenreKey();
  if(!genreKey || state.scope==='city') return;
  const entries = await fetchGenreChart(genreKey);
  if(activeRealGenreKey()!==genreKey || state.scope==='city') return; // user moved on
  const host = document.getElementById('homeGenreChartList');
  if(host) host.innerHTML = realChartListHTML(entries, { freeLimit: isPro() ? null : FREE_LIMIT_TRACKS });

  const favs = Object.values(favMap), mine = [];
  favs.forEach(f=>radarMatch(rows,f.title,f.artist).forEach(r=>{
    const d = r.prev==null ? null : r.prev-r.rank;
    if(d===0) return;
    mine.push({s: d==null ? 50 : Math.abs(d), h: d==null ? item('🆕',esc(f.title),`Nouveau dans ${esc(radarWhere(r))} : #${r.rank}`) : item(d>0?'📈':'📉',esc(f.title),`${esc(radarWhere(r))} : #${r.rank} (${d>0?'▲':'▼'} ${Math.abs(d)})`)});
  }));
  mine.sort((a,b)=>b.s-a.s);
  const seen = new Set(), top = rows.filter(r=>r.prev!=null && r.prev>r.rank).sort((a,b)=>(b.prev-b.rank)-(a.prev-a.rank)).filter(r=>!seen.has(r.q) && seen.add(r.q)).slice(0,10)
    .map(r=>item('📈',esc(r.title),`${esc(r.artist)} · ${esc(radarWhere(r))} : #${r.rank} (▲ ${r.prev-r.rank})`));
  const h = t=>`<div class="section-title"><h2>${t}</h2></div>`;
  return h('♥ Vos favoris')
    + (!favs.length ? '<div class="empty-msg">Mettez des morceaux en favori ♡ pour suivre leurs mouvements.</div>' : mine.length ? mine.map(m=>m.h).join('') : '<div class="empty-msg">Aucun mouvement sur vos favoris pour le moment.</div>')
    + h('📈 Plus fortes hausses') + (top.join('') || '<div class="empty-msg">Pas encore de mouvements.</div>');
}
